name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, pdo_mysql
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint application PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run validator tests
        run: php tests/validators_test.php

      - name: Run webhook security tests
        run: php tests/webhook_test.php

      - name: Reject Telegram tokens in tracked files
        run: |
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{30,}' -- ':!*.md'; then
            echo 'Possible Telegram bot token found in tracked files.' >&2
            exit 1
          fi

      - name: Reject legacy hard-coded database password
        run: |
          if git grep -nE '\$Db_Password[[:space:]]*=[[:space:]]*"[^"]+"' -- ':!*.md'; then
            echo 'Possible hard-coded database password found in tracked files.' >&2
            exit 1
          fi

      - name: Audit dependencies
        run: composer audit --no-interaction

  mysql:
    name: MySQL migration and concurrency
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic_test_password
          MYSQL_DATABASE: travel_tour_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Test legacy migration, relational workflows and concurrent requests
        run: php tests/mysql_test.php
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=travel_tour_test;charset=utf8mb4
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: synthetic_test_password
