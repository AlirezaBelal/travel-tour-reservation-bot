name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, pdo_mysql
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint application PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './medoo/vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run validator tests
        run: php tests/validators_test.php

      - name: Reject Telegram tokens in tracked files
        run: |
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{30,}' -- ':!*.md'; then
            echo 'Possible Telegram bot token found in tracked files.' >&2
            exit 1
          fi

      - name: Reject obvious database-password assignments
        run: |
          if git grep -nEi '(DB_PASSWORD|Db_Password)\s*[=:]\s*["'"''][^$<{][^"'"'']{5,}["'"'']' -- ':!*.md' ':!.env.example'; then
            echo 'Possible hard-coded database password found in tracked files.' >&2
            exit 1
          fi

      - name: Audit dependencies
        run: composer audit --no-interaction
